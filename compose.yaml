name: rehab

services:
  postgres-dev:
    image: postgres:16
    environment:
      POSTGRES_DB: rehab_dev
      POSTGRES_USER: rehab_dev
      POSTGRES_PASSWORD: ${REHAB_DEV_DB_PASSWORD:?Set REHAB_DEV_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REHAB_DEV_DB_PORT:-25432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: rehab_test
      POSTGRES_USER: rehab_test
      POSTGRES_PASSWORD: ${REHAB_TEST_DB_PASSWORD:?Set REHAB_TEST_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REHAB_TEST_DB_PORT:-25433}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-dev-data:
  postgres-test-data:
