openapi: 3.1.0
info:
  title: Rehab API
  summary: REST API застосунку для відстеження періоду тверезості.
  description: 'Code-First API: специфікація OpenAPI генерується автоматично з коду.


    Архітектура: Layered Monolith (ADR-001), СУБД PostgreSQL (ADR-002). У цій версії
    замість БД використовуються дані-заглушки в пам''яті.'
  version: 1.0.0
paths:
  /api/v1/calendar/entries:
    post:
      tags:
      - Calendar
      summary: Створити відмітку дня
      description: Відмічає день як тверезий (`sober`) або зрив (`relapse`) для поточного
        користувача. Майбутні дати заборонені (FR-002). На одну дату може бути лише
        один запис. При зриві серія обнуляється, а ментор отримує сповіщення (FR-003);
        у заглушці сповіщення не надсилається.
      operationId: create_entry_api_v1_calendar_entries_post
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Запис створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
          headers:
            Location:
              description: URL створеного запису
              schema:
                type: string
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Запис на цю дату вже існує
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Calendar
      summary: Отримати список відміток
      description: Повертає відмітки поточного користувача, відсортовані від нових
        до старих. Підтримує фільтр за діапазоном дат та пагінацію (`limit`, `offset`).
      operationId: list_entries_api_v1_calendar_entries_get
      security:
      - BearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Початок діапазону (включно), YYYY-MM-DD.
          title: From
        description: Початок діапазону (включно), YYYY-MM-DD.
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Кінець діапазону (включно), YYYY-MM-DD.
          title: To
        description: Кінець діапазону (включно), YYYY-MM-DD.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки (1-100).
          default: 30
          title: Limit
        description: Розмір сторінки (1-100).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Скільки записів пропустити.
          default: 0
          title: Offset
        description: Скільки записів пропустити.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/calendar/entries/{record_id}:
    patch:
      tags:
      - Calendar
      summary: Змінити статус відміченого дня
      description: Змінює статус (і тригер) існуючого запису. Дату змінити не можна.
        Редагування дозволене лише протягом 48 годин з моменту створення запису (FR-008),
        після цього повертається 403.
      operationId: update_entry_api_v1_calendar_entries__record_id__patch
      security:
      - BearerAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Ідентифікатор запису.
          examples:
          - 2
          title: Record Id
        description: Ідентифікатор запису.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Минуло 48 годин з моменту створення запису
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Запис не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/goals:
    post:
      tags:
      - Goals
      summary: Створити ціль
      description: Створює нову ціль тверезості (кількість днів від 1 до 3650). Нова
        ціль завжди створюється з `is_achieved=false` (FR-004).
      operationId: create_goal_api_v1_goals_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
        required: true
      responses:
        '201':
          description: Ціль створено
          headers:
            Location:
              description: URL створеної цілі
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/goals/{goal_id}:
    get:
      tags:
      - Goals
      summary: Отримати ціль
      description: Повертає ціль поточного користувача та ознаку її досягнення (FR-004,
        FR-005).
      operationId: get_goal_api_v1_goals__goal_id__get
      security:
      - BearerAuth: []
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Ідентифікатор цілі.
          examples:
          - 1
          title: Goal Id
        description: Ідентифікатор цілі.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ціль не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Goals
      summary: Замінити ціль
      description: Повністю замінює цільову кількість днів. Ознака `is_achieved` керується
        системою (FR-005) і через цей ендпоінт не змінюється.
      operationId: replace_goal_api_v1_goals__goal_id__put
      security:
      - BearerAuth: []
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Ідентифікатор цілі.
          examples:
          - 1
          title: Goal Id
        description: Ідентифікатор цілі.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ціль не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Goals
      summary: Видалити ціль
      description: Видаляє ціль поточного користувача. Відповідь без тіла.
      operationId: delete_goal_api_v1_goals__goal_id__delete
      security:
      - BearerAuth: []
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Ідентифікатор цілі.
          examples:
          - 1
          title: Goal Id
        description: Ідентифікатор цілі.
      responses:
        '204':
          description: Ціль видалено
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ціль не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DayStatus:
      type: string
      enum:
      - sober
      - relapse
      title: DayStatus
      description: Статус дня в календарі (DayRecord.status).
    EntryCreate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки у форматі YYYY-MM-DD. Не може бути в майбутньому
            (FR-002).
          examples:
          - '2026-10-07'
      type: object
      required:
      - status
      - date
      title: EntryCreate
      description: Тіло запиту на створення відмітки дня (FR-001, FR-002).
      examples:
      - date: '2026-10-07'
        status: sober
      - date: '2026-10-07'
        status: relapse
        trigger_category: stress
    EntryList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EntryOut'
          type: array
          title: Items
          description: Записи поточної сторінки.
        total:
          type: integer
          title: Total
          description: Загальна кількість записів за фільтром.
          examples:
          - 120
        limit:
          type: integer
          title: Limit
          description: Розмір сторінки.
          examples:
          - 30
        offset:
          type: integer
          title: Offset
          description: Зміщення від початку.
          examples:
          - 0
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: EntryList
      description: Сторінка зі списком відміток.
    EntryOut:
      properties:
        record_id:
          type: integer
          title: Record Id
          description: Ідентифікатор запису.
          examples:
          - 1
        user_id:
          type: integer
          title: User Id
          description: Власник запису.
          examples:
          - 42
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки.
          examples:
          - '2026-10-07'
        status:
          $ref: '#/components/schemas/DayStatus'
          description: Статус дня.
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера зриву.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Час створення запису (UTC). Від нього рахується вікно редагування
            48 год (FR-008).
      type: object
      required:
      - record_id
      - user_id
      - date
      - status
      - created_at
      title: EntryOut
      description: Відмітка дня у відповіді API.
    EntryUpdate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
      type: object
      required:
      - status
      title: EntryUpdate
      description: 'Тіло запиту на зміну статусу дня (FR-008).


        Дату змінити не можна.'
      examples:
      - status: sober
      - status: relapse
        trigger_category: stress
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Машинозчитуваний код помилки.
          examples:
          - FUTURE_DATE_NOT_ALLOWED
        message:
          type: string
          title: Message
          description: Пояснення для людини.
          examples:
          - Не можна відмічати майбутні дні
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Details
          description: Додаткові подробиці (наприклад, перелік полів з помилками).
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Єдиний формат помилки для всіх ендпоінтів.
    GoalCreate:
      properties:
        target_days:
          type: integer
          maximum: 3650.0
          minimum: 1.0
          title: Target Days
          description: Цільова кількість днів без алкоголю (від 1 до 3650).
          examples:
          - 30
      type: object
      required:
      - target_days
      title: GoalCreate
      description: Тіло запиту на створення або повну заміну цілі (FR-004).
    GoalOut:
      properties:
        goal_id:
          type: integer
          title: Goal Id
          description: Ідентифікатор цілі.
          examples:
          - 1
        user_id:
          type: integer
          title: User Id
          description: Власник цілі.
          examples:
          - 42
        target_days:
          type: integer
          title: Target Days
          description: Цільова кількість днів.
          examples:
          - 30
        is_achieved:
          type: boolean
          title: Is Achieved
          description: Чи досягнуто ціль. Виставляє система, коли серія доходить до
            цілі (FR-005).
      type: object
      required:
      - goal_id
      - user_id
      - target_days
      - is_achieved
      title: GoalOut
      description: Ціль у відповіді API.
    TriggerCategory:
      type: string
      enum:
      - stress
      - holiday
      - social
      - other
      title: TriggerCategory
      description: Категорія тригера зриву (DayRecord.trigger_category).
  securitySchemes:
    BearerAuth:
      type: http
      description: Токен-заглушка у форматі `<роль>-<id>`, наприклад `user-42` або
        `mentor-7`.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Calendar
  description: 'Щоденні відмітки користувача (DayRecord): тверезий день або зрив.
    FR-001, FR-002, FR-003, FR-008.'
- name: Goals
  description: 'Цілі тверезості (Goal): цільова кількість днів і прогрес. FR-004,
    FR-005.'
