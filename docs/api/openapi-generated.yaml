openapi: 3.1.0
info:
  title: Rehab API
  summary: REST API застосунку для відстеження періоду тверезості.
  description: 'Code-First API: специфікація OpenAPI генерується автоматично з коду.


    Архітектура: Layered Monolith (ADR-001), СУБД PostgreSQL (ADR-002). У цій версії
    замість БД використовуються дані-заглушки в пам''яті.'
  version: 1.0.0
paths:
  /api/v1/calendar/entries:
    post:
      tags:
      - Calendar
      summary: Створити відмітку дня
      description: Відмічає день як тверезий (`sober`) або зрив (`relapse`) для поточного
        користувача. Майбутні дати заборонені (FR-002). На одну дату може бути лише
        один запис. При зриві серія обнуляється, а ментор отримує сповіщення (FR-003);
        у заглушці сповіщення не надсилається.
      operationId: create_entry_api_v1_calendar_entries_post
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Запис створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
          headers:
            Location:
              description: URL створеного запису
              schema:
                type: string
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Запис на цю дату вже існує
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Calendar
      summary: Отримати список відміток
      description: Повертає відмітки поточного користувача, відсортовані від нових
        до старих. Підтримує фільтр за діапазоном дат та пагінацію (`limit`, `offset`).
      operationId: list_entries_api_v1_calendar_entries_get
      security:
      - BearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Початок діапазону (включно), YYYY-MM-DD.
          title: From
        description: Початок діапазону (включно), YYYY-MM-DD.
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Кінець діапазону (включно), YYYY-MM-DD.
          title: To
        description: Кінець діапазону (включно), YYYY-MM-DD.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки (1-100).
          default: 30
          title: Limit
        description: Розмір сторінки (1-100).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Скільки записів пропустити.
          default: 0
          title: Offset
        description: Скільки записів пропустити.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/calendar/entries/{record_id}:
    patch:
      tags:
      - Calendar
      summary: Змінити статус відміченого дня
      description: Змінює статус (і тригер) існуючого запису. Дату змінити не можна.
        Редагування дозволене лише протягом 48 годин з моменту створення запису (FR-008),
        після цього повертається 403.
      operationId: update_entry_api_v1_calendar_entries__record_id__patch
      security:
      - BearerAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Ідентифікатор запису.
          examples:
          - 2
          title: Record Id
        description: Ідентифікатор запису.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Минуло 48 годин з моменту створення запису
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Запис не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/goals:
    get:
      tags:
      - Goals
      summary: Отримати фіксовані етапи тверезості
      description: Повертає етапи 7 і 30 днів та їхній прогрес для поточного користувача.
      operationId: list_goals_api_v1_goals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/statistics:
    get:
      tags:
      - Statistics
      summary: Отримати статистику тверезості
      description: Повертає кількість тверезих днів, днів із вживанням, поточну й
        найдовшу серії, а також прогрес цілей 7 і 30 днів. Дані обчислюються з календарних
        записів поточного користувача.
      operationId: get_statistics_api_v1_statistics_get
      security:
      - BearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          enum:
          - all
          - week
          - month
          - year
          type: string
          description: 'Період статистики: all — увесь час, week — останні 7 днів,
            month — поточний місяць, year — поточний рік.'
          default: all
          title: Period
        description: 'Період статистики: all — увесь час, week — останні 7 днів, month
          — поточний місяць, year — поточний рік.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DayStatus:
      type: string
      enum:
      - sober
      - relapse
      title: DayStatus
      description: Статус дня в календарі (DayRecord.status).
    Drink:
      properties:
        type:
          $ref: '#/components/schemas/DrinkType'
        volume_ml:
          type: integer
          exclusiveMinimum: 0.0
          title: Volume Ml
          description: Об'єм напою в мілілітрах (додатне ціле число).
      type: object
      required:
      - type
      - volume_ml
      title: Drink
      description: Один напій у записі про вживання.
    DrinkType:
      type: string
      enum:
      - beer
      - wine
      - spirits
      - cocktail
      - other
      title: DrinkType
      description: Тип алкогольного напою.
    EntryCreate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки у форматі YYYY-MM-DD. Не може бути в майбутньому
            (FR-002).
          examples:
          - '2026-10-07'
        drinks:
          items:
            $ref: '#/components/schemas/Drink'
          type: array
          title: Drinks
          description: Список алкогольних напоїв у записі.
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
          description: Необов'язковий коментар до запису.
      additionalProperties: false
      type: object
      required:
      - status
      - date
      title: EntryCreate
      description: Тіло запиту на створення відмітки дня (FR-001, FR-002).
      examples:
      - date: '2026-10-07'
        status: sober
      - date: '2026-10-07'
        status: relapse
        trigger_category: stress
    EntryList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EntryOut'
          type: array
          title: Items
          description: Записи поточної сторінки.
        total:
          type: integer
          title: Total
          description: Загальна кількість записів за фільтром.
          examples:
          - 120
        limit:
          type: integer
          title: Limit
          description: Розмір сторінки.
          examples:
          - 30
        offset:
          type: integer
          title: Offset
          description: Зміщення від початку.
          examples:
          - 0
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: EntryList
      description: Сторінка зі списком відміток.
    EntryOut:
      properties:
        record_id:
          type: integer
          title: Record Id
          description: Ідентифікатор запису.
          examples:
          - 1
        user_id:
          type: integer
          title: User Id
          description: Власник запису.
          examples:
          - 42
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки.
          examples:
          - '2026-10-07'
        status:
          $ref: '#/components/schemas/DayStatus'
          description: Статус дня.
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера зриву.
        drinks:
          items:
            $ref: '#/components/schemas/Drink'
          type: array
          title: Drinks
          description: Список напоїв у записі.
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          description: Коментар до запису.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Час створення запису (UTC). Від нього рахується вікно редагування
            48 год (FR-008).
      type: object
      required:
      - record_id
      - user_id
      - date
      - status
      - created_at
      title: EntryOut
      description: Відмітка дня у відповіді API.
    EntryUpdate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
      additionalProperties: false
      type: object
      required:
      - status
      title: EntryUpdate
      description: 'Тіло запиту на зміну статусу дня (FR-008).


        Дату змінити не можна.'
      examples:
      - status: sober
      - status: relapse
        trigger_category: stress
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Машинозчитуваний код помилки.
          examples:
          - FUTURE_DATE_NOT_ALLOWED
        message:
          type: string
          title: Message
          description: Пояснення для людини.
          examples:
          - Не можна відмічати майбутні дні
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Details
          description: Додаткові подробиці (наприклад, перелік полів з помилками).
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Єдиний формат помилки для всіх ендпоінтів.
    GoalList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GoalMilestoneOut'
          type: array
          title: Items
          description: Етапи 7 і 30 днів.
      type: object
      required:
      - items
      title: GoalList
      description: Фіксований перелік етапів поточного користувача.
    GoalMilestoneOut:
      properties:
        target_days:
          type: integer
          minimum: 1.0
          title: Target Days
          description: Тривалість етапу в днях.
        is_achieved:
          type: boolean
          title: Is Achieved
          description: Чи досягнуто етап за найкращою серією.
        progress_days:
          type: integer
          minimum: 0.0
          title: Progress Days
          description: Поточний прогрес, обмежений етапом.
      type: object
      required:
      - target_days
      - is_achieved
      - progress_days
      title: GoalMilestoneOut
      description: Стан одного фіксованого етапу тверезості.
    StatisticsOut:
      properties:
        period:
          type: string
          enum:
          - all
          - week
          - month
          - year
          title: Period
          description: Період статистики.
        tracking_start_date:
          type: string
          format: date
          title: Tracking Start Date
          description: Дата початку відстеження тверезості.
        period_start:
          type: string
          format: date
          title: Period Start
          description: Початок вибраного періоду.
        period_end:
          type: string
          format: date
          title: Period End
          description: Кінець вибраного періоду.
        sober_days:
          type: integer
          minimum: 0.0
          title: Sober Days
          description: Кількість тверезих днів у вибраному періоді.
        relapse_days:
          type: integer
          minimum: 0.0
          title: Relapse Days
          description: Кількість днів із вживанням у вибраному періоді.
        total_sober_days:
          type: integer
          minimum: 0.0
          title: Total Sober Days
          description: Усі тверезі дні від початку відстеження.
        current_streak:
          type: integer
          minimum: 0.0
          title: Current Streak
          description: Поточна безперервна серія тверезих днів.
        longest_streak:
          type: integer
          minimum: 0.0
          title: Longest Streak
          description: Найдовша безперервна серія тверезих днів.
        active_goal_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Goal Days
          description: Найближчий невиконаний етап 7/30 днів або null після обох.
        has_goals:
          type: boolean
          title: Has Goals
          description: Чи доступні фіксовані етапи (завжди true).
        completed_goal_days:
          items:
            type: integer
          type: array
          title: Completed Goal Days
          description: Виконані цілі у днях.
        goal_progress_days:
          type: integer
          minimum: 0.0
          title: Goal Progress Days
          description: Поточна серія днів для прогресу активної цілі.
      type: object
      required:
      - period
      - tracking_start_date
      - period_start
      - period_end
      - sober_days
      - relapse_days
      - total_sober_days
      - current_streak
      - longest_streak
      - active_goal_days
      - has_goals
      - goal_progress_days
      title: StatisticsOut
      description: Статистика тверезості для головної, цілей та екрана статистики.
    TriggerCategory:
      type: string
      enum:
      - stress
      - holiday
      - social
      - other
      title: TriggerCategory
      description: Категорія тригера зриву (DayRecord.trigger_category).
  securitySchemes:
    BearerAuth:
      type: http
      description: Підписаний JWT-токен доступу.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Calendar
  description: 'Щоденні відмітки користувача (DayRecord): тверезий день або зрив.
    FR-001, FR-002, FR-003, FR-008.'
- name: Goals
  description: 'Фіксовані етапи тверезості на 7 і 30 днів та прогрес. FR-004,
    FR-005.'
- name: Statistics
  description: 'Статистика тверезості: кількість днів, серії та автоматичні цілі на
    7 і 30 днів.'
