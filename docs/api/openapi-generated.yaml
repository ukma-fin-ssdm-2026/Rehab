openapi: 3.1.0
info:
  title: Rehab API
  summary: REST API застосунку для відстеження періоду тверезості.
  description: 'Code-First API: специфікація OpenAPI генерується автоматично з коду.


    Архітектура: Layered Monolith (ADR-001), СУБД PostgreSQL (ADR-002). У цій версії
    замість БД використовуються дані-заглушки в пам''яті.'
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - BearerAuth: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - BearerAuth: []
  /api/v1/calendar/entries:
    post:
      tags:
      - Calendar
      summary: Створити відмітку дня
      operationId: create_entry_api_v1_calendar_entries_post
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
    get:
      tags:
      - Calendar
      summary: List Entries
      operationId: list_entries_api_v1_calendar_entries_get
      security:
      - BearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
  /api/v1/calendar/entries/{record_id}:
    get:
      tags:
      - Calendar
      summary: Get Entry
      operationId: get_entry_api_v1_calendar_entries__record_id__get
      security:
      - BearerAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Record Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
    patch:
      tags:
      - Calendar
      summary: Update Entry
      operationId: update_entry_api_v1_calendar_entries__record_id__patch
      security:
      - BearerAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Record Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/goals:
    get:
      tags:
      - Goals
      summary: Отримати фіксовані етапи тверезості
      description: Повертає етапи 7 і 30 днів та їхній прогрес для поточного користувача.
      operationId: list_goals_api_v1_goals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/statistics:
    get:
      tags:
      - Statistics
      summary: Отримати статистику тверезості
      description: Повертає кількість тверезих днів, днів із вживанням, поточну й
        найдовшу серії, а також прогрес цілей 7 і 30 днів. Дані обчислюються з календарних
        записів поточного користувача.
      operationId: get_statistics_api_v1_statistics_get
      security:
      - BearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          enum:
          - all
          - week
          - month
          - year
          type: string
          description: 'Період статистики: all — увесь час, week — останні 7 днів,
            month — поточний місяць, year — поточний рік.'
          default: all
          title: Period
        description: 'Період статистики: all — увесь час, week — останні 7 днів, month
          — поточний місяць, year — поточний рік.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - Health
      summary: Health
      description: Процес працює. До БД не звертається.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - Health
      summary: Ready
      description: 'Сервіс готовий: БД відповідає на SELECT 1.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
  /api/v1/admin/users:
    get:
      tags:
      - Admin
      summary: List Users
      description: Сторінка акаунтів без хешів паролів і службових полів.
      operationId: list_users_api_v1_admin_users_get
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Потрібна роль admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/users/{user_id}/block:
    patch:
      tags:
      - Admin
      summary: Block User
      description: Блокує або розблокує акаунт. Розблокування не оживляє старі токени.
      operationId: block_user_api_v1_admin_users__user_id__block_patch
      security:
      - BearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Потрібна роль admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Акаунт не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/trigger-distribution:
    get:
      tags:
      - Admin
      summary: Trigger Distribution
      description: Анонімний розподіл тригерів зривів за останні 30 днів усіх акаунтів.
      operationId: trigger_distribution_api_v1_admin_trigger_distribution_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerDistributionOut'
        '401':
          description: Відсутній або недійсний Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Потрібна роль admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
components:
  schemas:
    AdminUserList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminUserOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: AdminUserList
    AdminUserOut:
      properties:
        user_id:
          type: integer
          title: User Id
        name:
          type: string
          title: Name
        nickname:
          type: string
          title: Nickname
        email:
          type: string
          title: Email
        role:
          type: string
          enum:
          - user
          - mentor
          - admin
          title: Role
        is_blocked:
          type: boolean
          title: Is Blocked
      type: object
      required:
      - user_id
      - name
      - nickname
      - email
      - role
      - is_blocked
      title: AdminUserOut
      description: Публічний стан акаунта. Без password_hash і token_version.
    BlockRequest:
      properties:
        is_blocked:
          type: boolean
          title: Is Blocked
          description: 'true: заблокувати, false: розблокувати.'
      additionalProperties: false
      type: object
      required:
      - is_blocked
      title: BlockRequest
    DayStatus:
      type: string
      enum:
      - sober
      - relapse
      title: DayStatus
      description: Статус дня в календарі (DayRecord.status).
    Drink:
      properties:
        type:
          $ref: '#/components/schemas/DrinkType'
        volume_ml:
          type: integer
          exclusiveMinimum: 0.0
          title: Volume Ml
          description: Об'єм напою в мілілітрах (додатне ціле число).
      type: object
      required:
      - type
      - volume_ml
      title: Drink
      description: Один напій у записі про вживання.
    DrinkType:
      type: string
      enum:
      - beer
      - wine
      - spirits
      - cocktail
      - other
      title: DrinkType
      description: Тип алкогольного напою.
    EntryCreate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки у форматі YYYY-MM-DD. Не може бути в майбутньому
            (FR-002).
          examples:
          - '2026-10-07'
        drinks:
          items:
            $ref: '#/components/schemas/Drink'
          type: array
          title: Drinks
          description: Список алкогольних напоїв у записі.
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
          description: Необов'язковий коментар до запису.
      additionalProperties: false
      type: object
      required:
      - status
      - date
      title: EntryCreate
      description: Тіло запиту на створення відмітки дня (FR-001, FR-002).
      examples:
      - date: '2026-10-07'
        status: sober
      - date: '2026-10-07'
        status: relapse
        trigger_category: stress
    EntryList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EntryOut'
          type: array
          title: Items
          description: Записи поточної сторінки.
        total:
          type: integer
          title: Total
          description: Загальна кількість записів за фільтром.
          examples:
          - 120
        limit:
          type: integer
          title: Limit
          description: Розмір сторінки.
          examples:
          - 30
        offset:
          type: integer
          title: Offset
          description: Зміщення від початку.
          examples:
          - 0
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: EntryList
      description: Сторінка зі списком відміток.
    EntryOut:
      properties:
        record_id:
          type: integer
          title: Record Id
          description: Ідентифікатор запису.
          examples:
          - 1
        user_id:
          type: integer
          title: User Id
          description: Власник запису.
          examples:
          - 42
        date:
          type: string
          format: date
          title: Date
          description: Дата відмітки.
          examples:
          - '2026-10-07'
        status:
          $ref: '#/components/schemas/DayStatus'
          description: Статус дня.
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера зриву.
        drinks:
          items:
            $ref: '#/components/schemas/Drink'
          type: array
          title: Drinks
          description: Список напоїв у записі.
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          description: Коментар до запису.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Час створення запису (UTC). Від нього рахується вікно редагування
            48 год (FR-008).
      type: object
      required:
      - record_id
      - user_id
      - date
      - status
      - created_at
      title: EntryOut
      description: Відмітка дня у відповіді API.
    EntryUpdate:
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
          description: 'Статус дня: `sober` (тверезий) або `relapse` (зрив).'
          examples:
          - sober
        trigger_category:
          anyOf:
          - $ref: '#/components/schemas/TriggerCategory'
          - type: 'null'
          description: Категорія тригера. Дозволена лише для `status=relapse`.
      additionalProperties: false
      type: object
      required:
      - status
      title: EntryUpdate
      description: 'Тіло запиту на зміну статусу дня (FR-008).


        Дату змінити не можна.'
      examples:
      - status: sober
      - status: relapse
        trigger_category: stress
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Машинозчитуваний код помилки.
          examples:
          - FUTURE_DATE_NOT_ALLOWED
        message:
          type: string
          title: Message
          description: Пояснення для людини.
          examples:
          - Не можна відмічати майбутні дні
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Details
          description: Додаткові подробиці (наприклад, перелік полів з помилками).
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Єдиний формат помилки для всіх ендпоінтів.
    GoalList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GoalMilestoneOut'
          type: array
          title: Items
          description: Етапи 7 і 30 днів.
      type: object
      required:
      - items
      title: GoalList
      description: Фіксований перелік етапів поточного користувача.
    GoalMilestoneOut:
      properties:
        target_days:
          type: integer
          minimum: 1.0
          title: Target Days
          description: Тривалість етапу в днях.
        is_achieved:
          type: boolean
          title: Is Achieved
          description: Чи досягнуто етап за найкращою серією.
        progress_days:
          type: integer
          minimum: 0.0
          title: Progress Days
          description: Поточний прогрес, обмежений етапом.
      type: object
      required:
      - target_days
      - is_achieved
      - progress_days
      title: GoalMilestoneOut
      description: Стан одного фіксованого етапу тверезості.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          const: 3600
          title: Expires In
          default: 3600
        user:
          $ref: '#/components/schemas/UserPublic'
      type: object
      required:
