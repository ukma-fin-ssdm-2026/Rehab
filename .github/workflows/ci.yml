name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/rehab-prototype]
    # AI-GENERATED START
    # Lab 10, бонус 2: зміни лише в документації не займають спільний раннер після злиття.
    # Для pull_request фільтр не додано: обов'язкові перевірки PR мають завжди звітувати.
    paths-ignore:
      - 'docs/**'
      - 'Labs/**'
      - '**/*.md'
    # AI-GENERATED END
  pull_request:
    branches: [main, develop, feature/rehab-prototype]

# AI-GENERATED START
# Lab 10, бонус 2: новий push у PR скасовує застарілий запуск цього PR.
# Для push група містить SHA, тому запуски на main не скасовуються і не замінюються.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# AI-GENERATED END

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and coverage
    runs-on: [self-hosted, linux]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rehab_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: rehab_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rehab_ci -d rehab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock

      - name: Apply test database migrations
        env:
          DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_dev
          TEST_DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_test
        run: python -m alembic -x test_db=true upgrade head

      - name: Run tests/reliability
        env:
          DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_dev
          TEST_DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_test
        run: python -m pytest tests/reliability/ -q

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_dev
          TEST_DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_test
        run: |
          python -m pytest -q \
            --cov=backend.app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: htmlcov/
          if-no-files-found: warn

  # AI-GENERATED START
  frontend-checks:
    name: Frontend lint, types and web export
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:api

      - name: Web export
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
        run: npm run export:web
  # AI-GENERATED END
