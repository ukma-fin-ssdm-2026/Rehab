name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/rehab-prototype]
  pull_request:
    branches: [main, develop, feature/rehab-prototype]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and coverage
    runs-on: [self-hosted, linux]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rehab_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: rehab_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rehab_ci -d rehab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply test database migrations
        env:
          DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_dev
          TEST_DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_test
        run: python -m alembic -x test_db=true upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_dev
          TEST_DATABASE_URL: postgresql+psycopg://rehab_ci:ci-only-disposable-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rehab_test
        run: |
          python -m pytest -q \
            --cov=backend.app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: htmlcov/
          if-no-files-found: warn

  # AI-GENERATED START
  frontend-checks:
    name: Frontend lint, types and web export
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Web export
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
        run: npm run export:web
  # AI-GENERATED END
