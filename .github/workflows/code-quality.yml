name: Code Quality

on:
  push:
    branches: [main, develop, feature/rehab-prototype]
    # AI-GENERATED START
    # Lab 10, бонус 2: зміни лише в документації не займають спільний раннер після злиття.
    # Для pull_request фільтр не додано: обов'язкові перевірки PR мають завжди звітувати.
    paths-ignore:
      - 'docs/**'
      - 'Labs/**'
      - '**/*.md'
    # AI-GENERATED END
  pull_request:
    branches: [main, develop, feature/rehab-prototype]

# AI-GENERATED START
# Lab 10, бонус 2: новий push у PR скасовує застарілий запуск цього PR.
# Для push група містить SHA, тому запуски на main не скасовуються і не замінюються.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# AI-GENERATED END

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install code quality tools
        run: |
          python -m pip install --only-binary=:all: black==26.10.1 flake8==7.4.1 bandit==1.9.4

      - name: Check formatting with Black
        run: python -m black --check backend

      - name: Check code style with Flake8
        run: python -m flake8 backend

      # AI-GENERATED START
      - name: Security scan with Bandit
        run: python -m bandit -r backend
      # AI-GENERATED END

      # The CI Pipeline owns the full test run, including PostgreSQL and coverage.
