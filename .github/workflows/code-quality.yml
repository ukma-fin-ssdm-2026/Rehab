name: Code Quality

on:
  push:
    branches: [main, develop, feature/rehab-prototype]
  pull_request:
    branches: [main, develop, feature/rehab-prototype]

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install code quality tools
        run: |
          python -m pip install black==26.10.1 flake8==7.4.1 bandit==1.9.4

      - name: Check formatting with Black
        run: python -m black --check backend

      - name: Check code style with Flake8
        run: python -m flake8 backend

      # AI-GENERATED START
      - name: Security scan with Bandit
        run: python -m bandit -r backend
      # AI-GENERATED END

      # The CI Pipeline owns the full test run, including PostgreSQL and coverage.
