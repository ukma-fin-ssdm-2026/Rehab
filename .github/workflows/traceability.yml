name: Lab07 Traceability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# AI-GENERATED START
# Lab 10, бонус 2: новий push у PR скасовує застарілий запуск цього PR.
# Для push група містить SHA, тому запуски на main не скасовуються і не замінюються.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# AI-GENERATED END

permissions:
  contents: read

jobs:
  traceability:
    name: RTM and test IDs
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test traceability validator
        run: python -m unittest discover -s scripts -p 'test_check_traceability.py' -v

      - name: Check requirement-to-test traceability
        run: python scripts/check_traceability.py
